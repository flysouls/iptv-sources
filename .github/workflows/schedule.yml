name: update schedule

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - run: npm install
      - run: npm run build

      - name: Fetch and generate M3U sources
        run: npm run m3u

      - run: npm run matrix

      - name: Copy verified channels
        run: |
          if [ -d "verified" ]; then
            cp -r verified/* m3u/ 2>/dev/null || true
            echo "Copied verified/ to m3u/"
          else
            echo "No verified/ directory, skipping"
          fi

      - name: Copy index page
        run: cp public/index.html m3u/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./m3u

      - name: Upload aggregated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-iptv
          path: |
            m3u/aggregated.m3u
            m3u/txt/aggregated.txt
          retention-days: 7

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
