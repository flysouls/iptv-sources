name: update schedule

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install yarn
        run: npm install yarn -g

      - run: yarn install
      - run: yarn build

      - name: Fetch and generate M3U sources
        run: yarn m3u
        env:
          ENABLE_STREAM_CHECK: "true"
          STREAM_CHECK_TIMEOUT: "5000"
          STREAM_CHECK_CONCURRENCY: "30"

      - run: yarn matrix

      - name: "Jekyll theme"
        run: cp ./_config.temp.yml ./m3u/_config.yml

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./m3u
          destination: ./_site

      - name: Upload aggregated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-iptv
          path: |
            m3u/aggregated.m3u
            m3u/txt/aggregated.txt
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
