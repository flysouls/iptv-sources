name: update script

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install yarn
        run: npm install yarn -g

      - run: yarn install
      - run: yarn build

      - name: Fetch and generate M3U sources
        run: yarn m3u
        env:
          ENABLE_STREAM_CHECK: "true"
          STREAM_CHECK_TIMEOUT: "5000"
          STREAM_CHECK_CONCURRENCY: "30"

      - run: yarn matrix

      - name: "Jekyll theme"
        run: mv ./_config.temp.yml ./m3u/_config.yml

      - name: Upload aggregated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-iptv
          path: |
            m3u/aggregated.m3u
            m3u/txt/aggregated.txt
          retention-days: 30

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./m3u
          enable_jekyll: true
          cname: m3u.ibert.me

      - name: discord
        uses: HerbertHe/discord-action@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          message: ${{ github.repository }} has been successfullly updated, see https://m3u.ibert.me to get more.
